---
name: Upstream release

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: upstream-release

env:
  UPSTREAM_IMAGE: nebulous/infinitude
  UPSTREAM_REPO: nebulous/infinitude

jobs:
  check:
    name: Check for an upstream release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Compare the latest upstream release against the pin
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          pinned="$(sed -nE "s|^ARG UPSTREAM_REF=${UPSTREAM_IMAGE}:([^@]+)@sha256:[0-9a-f]{64}$|\1|p" infinitude/Dockerfile)"
          for v in "${latest}" "${pinned}"; do
            case "${v}" in
              ''|*[!0-9.]*)
                echo "unexpected version: latest upstream '${latest}', pinned '${pinned}'" >&2
                exit 1
                ;;
            esac
          done
          echo "version=${latest}" >> "${GITHUB_OUTPUT}"
          newest="$(printf '%s\n%s\n' "${pinned}" "${latest}" | sort -V | tail -1)"
          if [ "${latest}" = "${pinned}" ] || [ "${newest}" = "${pinned}" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "already pinned to upstream ${pinned}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "upstream released ${latest}, pinned to ${pinned}"
          fi

      - name: Resolve the upstream image digest
        id: upstream
        if: steps.compare.outputs.changed == 'true'
        env:
          UPSTREAM_VERSION: ${{ steps.compare.outputs.version }}
        run: |
          set -euo pipefail
          token="$(curl -fsSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${UPSTREAM_IMAGE}:pull" | jq -r .token)"
          digest="$(curl -fsSI -H "Authorization: Bearer ${token}" -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" -H "Accept: application/vnd.oci.image.index.v1+json" "https://registry-1.docker.io/v2/${UPSTREAM_IMAGE}/manifests/${UPSTREAM_VERSION}" | tr -d '\r' | grep -i '^docker-content-digest:' | awk '{print $2}')" || true
          case "${digest}" in
            sha256:*)
              echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
              echo "${UPSTREAM_IMAGE}:${UPSTREAM_VERSION} is ${digest}"
              ;;
            *)
              echo "::notice::${UPSTREAM_IMAGE}:${UPSTREAM_VERSION} is not published yet, retrying on the next run"
              ;;
          esac

      - name: Match the upstream version and release
        if: steps.upstream.outputs.digest != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_VERSION: ${{ steps.compare.outputs.version }}
          NEW_DIGEST: ${{ steps.upstream.outputs.digest }}
        run: |
          set -euo pipefail
          sed -i -E "s|^ARG UPSTREAM_REF=.*|ARG UPSTREAM_REF=${UPSTREAM_IMAGE}:${UPSTREAM_VERSION}@${NEW_DIGEST}|" infinitude/Dockerfile
          sed -i -E "s|^version: \".*\"|version: \"${UPSTREAM_VERSION}\"|" infinitude/config.yaml
          gh api "repos/${UPSTREAM_REPO}/releases/tags/${UPSTREAM_VERSION}" --jq .body > upstream-notes.md
          .github/scripts/changelog-entry.py "${UPSTREAM_VERSION}" < upstream-notes.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infinitude/Dockerfile infinitude/config.yaml infinitude/CHANGELOG.md
          git commit -m "Update Infinitude to ${UPSTREAM_VERSION}"
          git push origin HEAD:main

          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so
          # start the release explicitly; workflow_dispatch is exempt.
          gh workflow run release.yml --ref main
