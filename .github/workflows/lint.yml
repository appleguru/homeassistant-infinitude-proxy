---
name: Lint

on:
  push:
  pull_request:

jobs:
  addon-lint:
    name: Add-on linter
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Run the Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: ./infinitude
